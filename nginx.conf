server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Contact form API (the "api" service in docker-compose.yml). "api" is
    # resolved per request via Docker's DNS, so nginx still starts and serves
    # the site even if the api container is down.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }

    # Long-lived caching for hashed, content-addressed build assets
    location ~* ^/assets/.*\.(js|css|png|jpe?g|webp|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # HTML must always revalidate — it references hashed, immutable
        # asset filenames above, so it's the one thing that must never be
        # served stale from a browser/proxy cache without a freshness check.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
